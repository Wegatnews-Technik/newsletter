services:
  db:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: newsletter
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-master-password
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
    post_start:
      - command: /docker-entrypoint-initdb.d/3-update-users.sh
        user: postgres
    secrets:
      - postgres-master-password
      - pg-subscriber
      - pg-mailbot
  subscriber:
    build:
      context: ./
      dockerfile: ./docker/subscriber/Dockerfile
    container_name: subscriber
    depends_on:
      - db
    ports:
      - 8080:8080
    secrets:
      - pg-subscriber
  mailbot:
    build:
      context: ./
      dockerfile: ./docker/mailbot/Dockerfile
    container_name: mailbot
    depends_on:
      - db
    env_file: ".env"
    secrets:
      - pg-mailbot
      - email-config
volumes:
  postgres_data:
secrets:
  postgres-master-password:
    file: ./.secrets/postgres-master-password
  pg-subscriber:
    file: ./.secrets/pg-subscriber
  pg-mailbot:
    file: ./.secrets/pg-mailbot
  email-config:
    file: ./.secrets/email-config
