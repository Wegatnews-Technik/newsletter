services:
  db:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-master-password
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
    secrets:
      - postgres-master-password
  subscriber:
    build:
      context: ./
      dockerfile: ./docker/subscriber/Dockerfile
    container_name: subscriber
    secrets:
      - pg-subscriber
  mailbot:
    build:
      context: ./
      dockerfile: ./docker/mailbot/Dockerfile
    container_name: mailbot
volumes:
  postgres_data:
secrets:
  postgres-master-password:
    file: ./.secrets/postgres-master-password
  pg-subscriber:
    file: ./.secrets/pg-subscriber
