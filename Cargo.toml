[package]
name = "newsletter"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres", "uuid" ] }
tokio = {version = "1.53.1", features = ["full"] }
check-if-email-exists = "0.11.7"
anyhow = "1.0.104"
thiserror = "2.0.20"
lettre = { version = "0.11.23", default-features=false, features = [
    "builder",
    "rustls",
    "hostname",
    "smtp-transport",
    "ring",
    "rustls-platform-verifier",
] }
rss = "2.1.2"
reqwest = "0.13.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features=["v7", "serde"] }
axum = { version = "0.8.9", features = ["http2", "tokio"] }
serde = "1.0.229"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
