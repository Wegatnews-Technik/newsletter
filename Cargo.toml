[package]
name = "newsletter"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres" ] }
tokio = {version = "1.53.1", features = ["full"] }
check-if-email-exists = "0.11.7"
anyhow = "1.0.104"
thiserror = "2.0.20"
lettre = { version = "0.11.23", default-features=false, features = [
    "builder",
    "rustls",
    "hostname",
    "smtp-transport",
    "ring",
    "rustls-platform-verifier",
] }
rss = "2.1.2"
reqwest = "0.13.5"
